name: DragonCrown
version: 1.1.0
main: com.example.dragoncrown.DragonCrownPlugin
api-version: 26.3
author: OpenAI
description: Adds the Dragon Crown helmet (3D item model) with continuous potion effects.
commands:
  dragoncrown:
    description: Dragon Crown administration.
    usage: /dragoncrown give [player]
    permission: dragoncrown.admin
permissions:
  dragoncrown.admin:
    description: Grants access to Dragon Crown administration features.
    default: op
